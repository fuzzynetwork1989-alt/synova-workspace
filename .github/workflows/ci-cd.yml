name: Enhanced Synova Brain CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Backend Tests and Validation
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd synova-core-api
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov black flake8 aiohttp

    - name: Code quality checks
      run: |
        cd synova-core-api
        black --check --diff .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run unit tests
      run: |
        cd synova-core-api
        pytest -v --cov=. --cov-report=xml || true

    - name: Test API locally
      run: |
        cd synova-core-api
        python test_local_api_ci.py

  # Docker Build and Test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./synova-core-api
        file: ./synova-core-api/Dockerfile
        push: false
        tags: synova-brain:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker container
      run: |
        docker run -d --name synova-test -p 8000:8000 synova-brain:test
        sleep 30

        # Test health endpoint
        curl -f http://localhost:8000/health || exit 1

        # Test generation endpoint
        curl -X POST http://localhost:8000/generate \
          -H "Content-Type: application/json" \
          -d '{"prompt":"test"}' || exit 1

        docker stop synova-test
        docker rm synova-test

  # Deploy to Railway (Production)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [backend-tests, docker-build]
    if: github.ref == 'refs/heads/main'

    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Railway
      run: |
        echo "🚀 Deploying to Railway..."
        echo "Railway deployment is automatic on push to main branch"
        echo "Service: https://synova-ai-production.up.railway.app"

    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for Railway deployment..."

        # Wait for deployment to complete
        for i in {1..30}; do
          if curl -f http://https://synova-ai-production.up.railway.app/health > /dev/null 2>&1; then
            echo "✅ Deployment successful"
            break
          fi
          echo "Waiting for deployment... ($i/30)"
          sleep 10
        done

  # Post-deployment Tests
  post-deployment-tests:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install aiohttp

    - name: Run production smoke tests
      run: |
        cd synova-core-api
        python test_production_smoke.py

  # Load Testing (Optional)
  load-test:
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install aiohttp

    - name: Load testing
      run: |
        cd synova-core-api
        python test_load_ci.py
