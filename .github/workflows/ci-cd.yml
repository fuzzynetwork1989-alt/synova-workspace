name: Enhanced Synova Brain CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Backend Tests and Validation
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd synova-core-api
        pip install --upgrade pip
        pip install -r requirements-railway.txt
        pip install pytest pytest-asyncio pytest-cov black flake8 mypy
    
    - name: Code quality checks
      run: |
        cd synova-core-api
        black --check .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        mypy main.py --ignore-missing-imports
    
    - name: Run unit tests
      run: |
        cd synova-core-api
        pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./synova-core-api/coverage.xml
        flags: backend
        name: backend-coverage

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install
        npm install --save-dev jest @testing-library/react @testing-library/jest-dom
    
    - name: Run tests
      run: |
        npm test -- --coverage --watchAll=false
    
    - name: Build frontend
      run: |
        npm run build
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  # Security Scans
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: python, javascript

  # Docker Build and Test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./synova-core-api
        file: ./synova-core-api/Dockerfile
        push: false
        tags: synova-brain:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker container
      run: |
        docker run -d --name synova-test -p 8000:8000 synova-brain:test
        sleep 30
        
        # Test health endpoint
        curl -f http://localhost:8000/health || exit 1
        
        docker stop synova-test
        docker rm synova-test

  # Deploy to Railway (Production)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    if: github.ref == 'refs/heads/main'
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Railway CLI
      run: |
        curl -fsSL https://github.com/railwayapp/railway/releases/download/v3.0.0/railway-v3.0.0-linux-x64.tar.gz | tar -xz
        sudo mv railway /usr/local/bin
    
    - name: Deploy to Railway
      run: |
        cd synova-core-api
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway up --service "Synova AI"
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Update production environment
      run: |
        cd synova-core-api
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        
        # Set production environment variables
        railway variables set SYNNOVA_BRAIN_ENABLED=true
        railway variables set MODEL_NAME=microsoft/DialoGPT-medium
        railway variables set DEVICE=cpu
        railway variables set STREAMING_ENABLED=true
        railway variables set FUNCTION_CALLING_ENABLED=true
        railway variables set ENVIRONMENT=production
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Notification
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      if: always()
