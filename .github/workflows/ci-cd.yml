name: Enhanced Synova Brain CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Backend Tests and Validation
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd synova-core-api
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov black flake8
    
    - name: Code quality checks
      run: |
        cd synova-core-api
        black --check --diff .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Run unit tests
      run: |
        cd synova-core-api
        pytest -v --cov=. --cov-report=xml || true
    
    - name: Test API locally
      run: |
        cd synova-core-api
        python -c "
import asyncio
import aiohttp
import json
import sys
import time

async def test_endpoints():
    # Start the server
    import subprocess
    import signal
    import os
    
    server = subprocess.Popen([sys.executable, 'main.py'])
    time.sleep(5)  # Wait for server to start
    
    try:
        async with aiohttp.ClientSession() as session:
            # Test health endpoint
            async with session.get('http://localhost:8000/health') as resp:
                if resp.status == 200:
                    data = await resp.json()
                    print('✅ Health check passed:', data)
                else:
                    print('❌ Health check failed:', resp.status)
            
            # Test generation endpoint
            payload = {'prompt': 'Test prompt'}
            async with session.post('http://localhost:8000/generate', json=payload) as resp:
                if resp.status == 200:
                    data = await resp.json()
                    print('✅ Generation test passed:', 'response' in data)
                else:
                    print('❌ Generation test failed:', resp.status)
    finally:
        server.terminate()
        server.wait()

asyncio.run(test_endpoints())
        "

  # Docker Build and Test
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./synova-core-api
        file: ./synova-core-api/Dockerfile
        push: false
        tags: synova-brain:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker container
      run: |
        docker run -d --name synova-test -p 8000:8000 synova-brain:test
        sleep 30
        
        # Test health endpoint
        curl -f http://localhost:8000/health || exit 1
        
        # Test generation endpoint
        curl -X POST http://localhost:8000/generate \
          -H "Content-Type: application/json" \
          -d '{"prompt":"test"}' || exit 1
        
        docker stop synova-test
        docker rm synova-test

  # Deploy to Railway (Production)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [backend-tests, docker-build]
    if: github.ref == 'refs/heads/main'
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Railway
      run: |
        echo "🚀 Deploying to Railway..."
        echo "Railway deployment is automatic on push to main branch"
        echo "Service: https://synova-ai-production.up.railway.app"
    
    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for Railway deployment..."
        
        # Wait for deployment to complete
        for i in {1..30}; do
          if curl -f http://https://synova-ai-production.up.railway.app/health > /dev/null 2>&1; then
            echo "✅ Deployment successful"
            break
          fi
          echo "Waiting for deployment... ($i/30)"
          sleep 10
        done

  # Post-deployment Tests
  post-deployment-tests:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install aiohttp
    
    - name: Run production smoke tests
      run: |
        python -c "
import asyncio
import aiohttp
import json

async def smoke_tests():
    base_url = 'https://synova-ai-production.up.railway.app'
    
    async with aiohttp.ClientSession() as session:
        # Test all endpoints
        endpoints = [
            '/health',
            '/',
            '/generate'
        ]
        
        results = {}
        for endpoint in endpoints:
            try:
                if endpoint == '/health' or endpoint == '/':
                    async with session.get(f'{base_url}{endpoint}') as resp:
                        results[endpoint] = resp.status
                else:
                    payload = {'prompt': 'smoke test'}
                    async with session.post(f'{base_url}{endpoint}', json=payload) as resp:
                        results[endpoint] = resp.status
            except Exception as e:
                results[endpoint] = f'ERROR: {e}'
        
        print('🧪 Smoke test results:')
        for endpoint, status in results.items():
            status_emoji = '✅' if str(status).startswith('2') else '❌'
            print(f'{status_emoji} {endpoint}: {status}')
        
        # Check if all critical endpoints are working
        critical_endpoints = ['/health', '/generate']
        all_critical_ok = all(str(results[e]).startswith('2') for e in critical_endpoints)
        
        if not all_critical_ok:
            print('❌ Critical endpoints failed')
            exit(1)
        else:
            print('✅ All smoke tests passed')

asyncio.run(smoke_tests())
        "

  # Load Testing (Optional)
  load-test:
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install aiohttp
    
    - name: Load testing
      run: |
        python -c "
import asyncio
import aiohttp
import time

async def load_test():
    base_url = 'https://synova-ai-production.up.railway.app'
    concurrent_requests = 5
    total_requests = 20
    
    async def single_request(session, request_id):
        start_time = time.time()
        try:
            async with session.post(f'{base_url}/generate', 
                                  json={'prompt': f'Load test {request_id}'}) as resp:
                await resp.text()
                return time.time() - start_time
        except:
            return float('inf')
    
    async with aiohttp.ClientSession() as session:
        # Run concurrent requests
        tasks = []
        for i in range(total_requests):
            if len(tasks) >= concurrent_requests:
                completed, tasks = await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)
                tasks = list(tasks)
            
            task = asyncio.create_task(single_request(session, i))
            tasks.append(task)
        
        # Wait for remaining tasks
        if tasks:
            await asyncio.gather(*tasks)
    
    print('🚀 Load test completed')

asyncio.run(load_test())
        "

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install
        npm install --save-dev jest @testing-library/react @testing-library/jest-dom
    
    - name: Run tests
      run: |
        npm test -- --coverage --watchAll=false
    
    - name: Build frontend
      run: |
        npm run build
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  # Security Scans
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: python, javascript

  # Notification
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      if: always()
